# Local development Postgres. The fixed project name means every git worktree
# shares the same container and volume instead of starting a clashing copy.
name: dinnr

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: dinnr
      POSTGRES_PASSWORD: dinnr
      POSTGRES_DB: dinnr
    ports:
      - "${DINNR_PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dinnr -d dinnr"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
