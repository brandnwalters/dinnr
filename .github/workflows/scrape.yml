# Production scrape: apply migrations, then scrape today's menus into Neon.
#
# Needs one repository secret, DATABASE_URL: the Neon connection string
# (see docs/deploy.md). A failed step fails the run, and GitHub emails the
# repo owner about failed scheduled runs.
name: scrape

on:
  schedule:
    # GitHub cron runs in UTC, and Chapel Hill shifts between EST (UTC-5) and
    # EDT (UTC-4), so one UTC time lands an hour apart across the year:
    #   09:30 UTC = 04:30 EST (Nov-Mar) = 05:30 EDT (Mar-Nov)
    # The earliest meal is weekday Breakfast at 7am, so both land 1.5-2.5 h
    # before it opens. That margin also absorbs GitHub's scheduled-run delays
    # (often 10-30+ min at busy times). It is also well after midnight Eastern,
    # so the scraper's "today" (America/New_York) is the day being served.
    - cron: "30 9 * * *"
    # Midday re-scrape, to pick up menu changes made during the day (e.g. dinner swaps):
    #   17:00 UTC = 12:00 EST (Nov-Mar) = 13:00 EDT (Mar-Nov)
    # Both fall during lunch and 4-5 h before dinner opens at 5pm, so even a
    # delayed run lands well before dinner. Re-running the same day updates that
    # day's menu in place (no duplicates; added items appear, removed ones go).
    - cron: "0 17 * * *"
  workflow_dispatch:

# Never run two scrapes at once against the same database.
concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: scraper
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: scraper/uv.lock

      - name: Check the database secret is set
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Repository secret DATABASE_URL is not set (see docs/deploy.md)"
            exit 1
          fi

      - name: Install scraper
        run: uv sync --locked --no-dev

      - name: Apply migrations
        run: uv run --no-dev dinnr-migrate

      - name: Scrape today's menus
        run: uv run --no-dev dinnr-scrape
