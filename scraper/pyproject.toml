[project]
name = "dinnr"
version = "0.1.0"
description = "Polite scraper for UNC dining hall menus and nutrition"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "psycopg[binary]>=3.2",
]

[project.scripts]
dinnr-scrape = "dinnr.cli:main"
dinnr-migrate = "dinnr.migrate:main"
dinnr-check-today = "dinnr.check_today:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinnr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
